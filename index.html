<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Groceries+</title>
  <meta name="theme-color" content="#eff1f5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Groceries+">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg?v=3" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png?v=3">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/basecoat.cdn.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500&text=Groceries%2B&display=swap" crossorigin>
  <link rel="stylesheet" href="style.css">
  <!-- html.dark picks Macchiato (and Basecoat's dark tweaks). Runs before paint so there's no flash. -->
  <script>
    const scheme = matchMedia("(prefers-color-scheme: dark)");
    // Global so app.js can re-apply after the theme setting changes.
    function applyScheme() {
      let prefs = {};
      try { prefs = JSON.parse(localStorage.getItem("groceries.v1"))?.prefs ?? {}; } catch {}
      const theme = prefs.theme ?? "system";
      const neutral = prefs.palette === "neutral";
      const dark = theme === "dark" || (theme === "system" && scheme.matches);
      document.documentElement.classList.toggle("dark", dark);
      document.documentElement.classList.toggle("neutral", neutral);
      document.querySelector('meta[name="theme-color"]').content = neutral ? (dark ? "#0a0a0a" : "#ffffff") : dark ? "#24273a" : "#eff1f5";
    }
    applyScheme();
    scheme.addEventListener("change", applyScheme);
  </script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <!-- Lucide icons (ISC), referenced with <use href="#i-…"> -->
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></symbol>
    <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  </svg>

  <div class="app">
    <header class="top">
      <div class="bar">
        <h1>Groceries+</h1>
        <button class="btn" data-variant="ghost" type="button" id="edit-btn" aria-pressed="false">Edit</button>
        <button class="btn" data-variant="ghost" data-size="icon" id="settings-btn" aria-label="Settings"><svg><use href="#i-settings"/></svg></button>
      </div>
      <form class="searchbar" id="search-form" role="search">
        <div class="search-field">
          <svg><use href="#i-search"/></svg>
          <input class="input" type="search" id="search" placeholder="Search or add an item" autocomplete="off" enterkeyhint="go" aria-label="Search or add an item">
          <button class="clear" type="button" id="search-clear" aria-label="Clear search"><svg><use href="#i-x"/></svg></button>
        </div>
        <button class="btn" data-size="icon" type="button" id="add-btn" aria-label="Add item"><svg><use href="#i-plus"/></svg></button>
      </form>
      <div class="filters">
        <div class="segment" role="group" aria-label="Filter">
          <button type="button" data-filter="pending">Pending</button>
          <button type="button" data-filter="all">All</button>
        </div>
        <div class="tagbar" id="tagbar" role="group" aria-label="Filter by tag" hidden></div>
      </div>
    </header>

    <main id="list" aria-live="polite"></main>
  </div>

  <!-- Add / edit item -->
  <dialog class="dialog" id="item-dialog" aria-labelledby="item-title" tabindex="-1">
    <div>
      <header><h2 id="item-title">Add item</h2></header>
      <section>
        <form class="stack" id="item-form" novalidate>
          <div class="field">
            <label class="label" for="f-name">Name</label>
            <input class="input" id="f-name" name="name" autocomplete="off" required>
          </div>
          <div class="field">
            <label class="label" for="f-category">Category</label>
            <select class="select" id="f-category" name="category"></select>
            <input class="input" name="newCategory" placeholder="New category name" autocomplete="off" aria-label="New category name" hidden>
          </div>
          <div class="field">
            <span class="label" id="f-tags-label">Tags</span>
            <div class="chips" id="f-tags" role="group" aria-labelledby="f-tags-label"></div>
            <div class="new-tag" id="f-new-tag" hidden>
              <input class="input" name="newTag" placeholder="Tag name" autocomplete="off" enterkeyhint="done" aria-label="New tag name">
              <div class="swatches" id="f-tag-colors" role="radiogroup" aria-label="Tag color"></div>
              <button class="btn" data-variant="secondary" type="button" id="f-tag-add">Add tag</button>
            </div>
          </div>
          <div class="field">
            <label class="label" for="f-quantity">Quantity</label>
            <input class="input" id="f-quantity" name="quantity" type="number" min="1" max="20" inputmode="numeric">
          </div>
          <label class="switch-row"><span>Important</span><input class="input" type="checkbox" role="switch" name="important"></label>
          <label class="switch-row"><span>One-time <small>removed once you have it</small></span><input class="input" type="checkbox" role="switch" name="oneTime"></label>
          <p class="error" id="item-error" role="alert"></p>
        </form>
      </section>
      <footer>
        <button class="btn" data-variant="destructive" type="button" id="item-delete">Delete</button>
        <span class="spacer"></span>
        <button class="btn" data-variant="outline" type="button" data-close>Cancel</button>
        <button class="btn" type="submit" form="item-form">Save</button>
      </footer>
    </div>
  </dialog>

  <!-- Edit category -->
  <dialog class="dialog" id="category-dialog" aria-labelledby="category-title">
    <div>
      <header><h2 id="category-title">Edit category</h2></header>
      <section>
        <form class="stack" id="category-form" novalidate>
          <div class="field">
            <label class="label" for="c-name">Name</label>
            <input class="input" id="c-name" name="name" autocomplete="off" required>
          </div>
          <div class="field">
            <span class="label">Color</span>
            <div class="swatches" id="c-colors" role="radiogroup" aria-label="Category color"></div>
          </div>
          <p class="error" id="category-error" role="alert"></p>
        </form>
      </section>
      <footer>
        <button class="btn" data-variant="destructive" type="button" id="category-delete">Delete</button>
        <span class="spacer"></span>
        <button class="btn" data-variant="outline" type="button" data-close>Cancel</button>
        <button class="btn" type="submit" form="category-form">Save</button>
      </footer>
    </div>
  </dialog>

  <!-- Edit tag -->
  <dialog class="dialog" id="tag-dialog" aria-labelledby="tag-title">
    <div>
      <header><h2 id="tag-title">Edit tag</h2></header>
      <section>
        <form class="stack" id="tag-form" novalidate>
          <div class="field">
            <label class="label" for="t-name">Name</label>
            <input class="input" id="t-name" name="name" autocomplete="off" required>
          </div>
          <div class="field">
            <span class="label">Color</span>
            <div class="swatches" id="t-colors" role="radiogroup" aria-label="Tag color"></div>
          </div>
          <p class="error" id="tag-error" role="alert"></p>
        </form>
      </section>
      <footer>
        <button class="btn" data-variant="destructive" type="button" id="tag-delete">Delete</button>
        <span class="spacer"></span>
        <button class="btn" data-variant="outline" type="button" data-close>Cancel</button>
        <button class="btn" type="submit" form="tag-form">Save</button>
      </footer>
    </div>
  </dialog>

  <!-- Settings: backup lives here because localStorage can be wiped -->
  <dialog class="dialog" id="settings-dialog" aria-labelledby="settings-title">
    <div>
      <header>
        <h2 id="settings-title">Settings</h2>
        <p>Your list lives only in this browser. Export a backup now and then.</p>
      </header>
      <section class="stack">
        <dl class="facts">
          <dt>Items</dt><dd id="s-items"></dd>
          <dt>Categories</dt><dd id="s-categories"></dd>
          <dt>Tags</dt><dd id="s-tags"></dd>
          <dt>Last backup</dt><dd id="s-export"></dd>
          <dt>Storage</dt><dd id="s-storage"></dd>
        </dl>
        <div class="field">
          <span class="label">Theme</span>
          <div class="segment" role="group" aria-label="Theme">
            <button type="button" data-theme="system">Auto</button>
            <button type="button" data-theme="light">Light</button>
            <button type="button" data-theme="dark">Dark</button>
          </div>
        </div>
        <div class="field">
          <span class="label">Style</span>
          <div class="segment" role="group" aria-label="Style">
            <button type="button" data-palette="catppuccin">Catppuccin</button>
            <button type="button" data-palette="neutral">Neutral</button>
          </div>
        </div>
        <div class="field">
          <span class="label">Tags</span>
          <ul class="tag-list" id="s-tag-list"></ul>
        </div>
        <button class="btn" type="button" id="export-btn">Export backup (.json)</button>
        <button class="btn" data-variant="outline" type="button" id="import-btn">Import backup…</button>
        <input type="file" id="import-file" accept=".json,application/json" hidden>
        <button class="btn" data-variant="destructive" type="button" id="clear-btn">Clear all data</button>
      </section>
      <footer>
        <button class="btn" data-variant="outline" type="button" data-close>Close</button>
      </footer>
    </div>
  </dialog>

  <div class="toaster" id="toaster" data-align="center"></div>
</body>
</html>
